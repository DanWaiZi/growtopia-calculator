<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Autoclave Calculator</title>
    <!-- 1. Library Integration -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        /* Styling for the Download Button */
        #downloadBtn {
            display: none;
            width: 100%;
            background-color: #64748b;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
            transition: background 0.3s ease;
        }

        #downloadBtn:hover {
            background-color: #475569;
        }

        .result-box {
            background-color: #0a192f;
            border-radius: 8px;
            padding: 20px;
            margin-top: 20px;
        }
    </style>
</head>

<body>
    <!-- Fixed Button Class -->
    <button class="menu-toggle" onclick="toggleMenu()">☰</button>
    <div id="overlay" class="overlay" onclick="toggleMenu()"></div>

    <!-- Sidebar Navigation -->
    <div class="navbar" id="sideNav">
        <div class="navbar-title">
            <img src="image/title.png" alt="Growtopia" class="navbar-logo">
            <span class="navbar-title-text">Calculator</span>
            <img src="image/profile.jpg" alt="Profile" class="navbar-profile">
            <span class="subtitle">by TDoomGT</span>
        </div>
        <div class="nav-links">
            <a href="index.html" class="nav-link" id="nav-home">
                <i><img src="image/home.png" alt="Home" style="width: 22px;"></i>
                <span class="nav-text">Home</span>
            </a>
            <a href="fishing.html" class="nav-link" id="nav-fishing"><i><img src="image/fishing/fishing_nav.png"
                        alt="Fishing"></i><span class="nav-text">Fishing</span></a>
            <a href="pepper.html" class="nav-link" id="nav-pepper"><i><img src="image/pepper_recycling/pepper_nav.png"
                        alt="Pepper"></i><span class="nav-text">Pepper Recycling</span></a>
            <a href="science.html" class="nav-link" id="nav-science"><i><img src="image/science_station/science_nav.png"
                        alt="Science"></i><span class="nav-text">Science Station</span></a>
            <a href="tackle.html" class="nav-link" id="nav-tackle"><i><img src="image/tackle_box/tackle_nav.png"
                        alt="Tackle"></i><span class="nav-text">Tackle Box</span></a>
            <a href="autoclave.html" class="nav-link" id="nav-autoclave"><i><img
                        src="image/auto_clave/autoclave_nav.png" alt="Autoclave"></i><span
                    class="nav-text">Autoclave</span></a>
        </div>
    </div>
    <div class="container">
        <h1>Autoclave Calculator</h1>

        <div class="input-group">
            <label>Starting Surgical Stitches</label>
            <input type="number" id="start_stitches" value="0" min="0">
        </div>
        <div class="input-group">
            <label>Surgical Price (qty)/(price)</label>
            <input type="text" id="surgical_price" value="3/1" placeholder="e.g., 20/1">
        </div>
        <div class="input-group">
            <label>Surgical Stitches Price (qty)/(price)</label>
            <input type="text" id="stitches_price" value="1/4" placeholder="e.g., 1/1">
        </div>

        <div class="input-group">
            <label>Apply to All Tools</label>
            <div style="display: flex; gap: 10px;">
                <input type="number" id="bulk_amount" value="200" min="0" style="flex: 1;">
                <button onclick="applyBulkAmount()"
                    style="width: 100px; margin: 0; padding: 10px; background: #0ea5e9; color: white; border: none; border-radius: 8px; cursor: pointer;">Apply</button>
            </div>
        </div>

        <div id="autoclave_inputs" class="input-grid"></div>

        <button onclick="calcAutoclave()" style="margin-top: 20px;">Calculate</button>

        <button id="downloadBtn" onclick="downloadResult()">Download Result as Image</button>

        <div id="autoclave_res" class="result-box" style="display: none;"></div>
    </div>

    <script>
        function toggleMenu() {
            const nav = document.getElementById('sideNav');
            const overlay = document.getElementById('overlay');
            const btn = document.querySelector('.menu-toggle');
            nav.classList.toggle('active');
            overlay.classList.toggle('active');
            btn.innerHTML = nav.classList.contains('active') ? '✕' : '☰';
        }

        const autoclaveTools = [
            { id: 'surgical_antibiotics', label: 'Surgical Antibiotics' },
            { id: 'surgical_antiseptic', label: 'Surgical Antiseptic' },
            { id: 'surgical_clamp', label: 'Surgical Clamp' },
            { id: 'surgical_scalpel', label: 'Surgical Scalpel' },
            { id: 'surgical_sponge', label: 'Surgical Sponge' },
            { id: 'surgical_anesthetic', label: 'Surgical Anesthetic' },
            { id: 'surgical_splint', label: 'Surgical Splint' },
            { id: 'surgical_defibrillator', label: 'Surgical Defibrillator' },
            { id: 'surgical_pins', label: 'Surgical Pins' },
            { id: 'surgical_lab_kit', label: 'Surgical Lab Kit' },
            { id: 'surgical_transfusion', label: 'Surgical Transfusion' }
        ];

        const inputContainer = document.getElementById('autoclave_inputs');
        autoclaveTools.forEach(tool => {
            inputContainer.innerHTML += `
                <div class="input-group">
                    <label>${tool.label}</label>
                    <input type="number" id="auto_${tool.id}" value="0" min="0">
                </div>`;
        });

        function parseRatio(str) {
            if (str.includes('/')) {
                const p = str.split('/');
                return parseFloat(p[1]) / parseFloat(p[0]);
            }
            return 1 / parseFloat(str);
        }

        function applyBulkAmount() {
            const amount = document.getElementById('bulk_amount').value;
            autoclaveTools.forEach(tool => {
                document.getElementById(`auto_${tool.id}`).value = amount;
            });
        }

        function calcAutoclave() {
            const res = document.getElementById('autoclave_res');
            const downloadBtn = document.getElementById('downloadBtn');

            res.style.display = 'block';
            downloadBtn.style.display = 'block';

            const startStitches = parseInt(document.getElementById('start_stitches').value) || 0;
            const pricePerTool = parseRatio(document.getElementById('surgical_price').value);
            const pricePerStitch = parseRatio(document.getElementById('stitches_price').value);

            let totalToolCost = 0;
            let toolCounts = {};
            let initialToolTotal = 0;

            // Calculate the actual initial cost based on tools entered
            autoclaveTools.forEach(tool => {
                const qty = parseInt(document.getElementById(`auto_${tool.id}`).value) || 0;
                toolCounts[tool.id] = qty;
                initialToolTotal += qty;
            });

            totalToolCost = initialToolTotal * pricePerTool;

            let stitches = startStitches;
            let processing = true;

            // Conversion Logic
            while (processing) {
                let toolToConvert = null;
                let maxCount = 19;
                autoclaveTools.forEach(tool => {
                    if (toolCounts[tool.id] > maxCount) {
                        maxCount = toolCounts[tool.id];
                        toolToConvert = tool.id;
                    }
                });

                if (toolToConvert) {
                    toolCounts[toolToConvert] -= 20;
                    stitches += 1;
                    autoclaveTools.forEach(tool => {
                        if (tool.id !== toolToConvert) toolCounts[tool.id] += 1;
                    });
                } else {
                    processing = false;
                }
            }

            const totalEarned = stitches * pricePerStitch;
            const profit = totalEarned - totalToolCost;
            res.innerHTML = `
                <h3 style="text-align:center; border-bottom: 1px solid #334155; padding-bottom: 10px; margin-top: 0;">AUTOCLAVE SUMMARY</h3>
                <div class="result-item" style="display: flex; justify-content: space-between; padding: 10px 0;">
                    <span style="color: #94a3b8;">Total Cost:</span> <span style="color:white;">${totalToolCost.toFixed(1)} WL</span>
                </div>
                <div class="result-item" style="display: flex; justify-content: space-between; padding: 10px 0;">
                    <span style="color: #94a3b8;">Final Stitches:</span> <span style="color:white;">${stitches}</span>
                </div>
                <div class="result-item" style="display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #334155; padding-bottom: 15px;">
                    <span style="color: #94a3b8;">Total Earned:</span> <span style="color:white;">${totalEarned.toFixed(1)} WL</span>
                </div>
                <div class="result-item" style="display: flex; justify-content: space-between; padding: 12px 0; margin-top: 10px; font-weight: bold; color: ${profit >= 0 ? '#4ade80' : '#f87171'};">
                    <span>ESTIMATE PROFIT:</span> <span>${profit.toFixed(1)} WL</span>
                </div>
            `;
        }

        function downloadResult() {
            const resultBox = document.getElementById('autoclave_res');
            const exportBg = "#0f172a";

            html2canvas(resultBox, {
                backgroundColor: exportBg,
                scale: 3,
                logging: false,
                useCORS: true,
                allowTaint: true,
                onclone: (clonedDoc) => {
                    const clonedRes = clonedDoc.getElementById('autoclave_res');
                    clonedRes.style.display = 'block';
                    clonedRes.style.background = exportBg;
                    clonedRes.style.padding = '25px';
                    clonedRes.style.animation = 'none';

                    const items = clonedRes.querySelectorAll('.result-item');
                    items.forEach(item => {
                        item.style.opacity = '1';
                        item.style.display = 'flex';
                        item.style.justifyContent = 'space-between';
                        item.style.visibility = 'visible';
                        const currentColor = window.getComputedStyle(item).color;
                        item.style.color = currentColor;
                    });

                    const header = clonedRes.querySelector('h3');
                    if (header) {
                        header.style.borderBottom = '1px solid #334155';
                    }
                }
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = 'autoclave_report.png';
                link.href = canvas.toDataURL("image/png", 1.0);
                link.click();
            });
        }
        
        const navLinks = document.querySelectorAll('.nav-link');
        let currentPage = window.location.pathname.split('/').pop();

        if (currentPage === '' || currentPage === 'growtopia-calculator') {
            currentPage = 'index.html';
        }

        navLinks.forEach(link => {
            const linkHref = link.getAttribute('href');
            if (linkHref === currentPage) {
                link.classList.add('active');
            } else {
                link.classList.remove('active');
            }
        });
    </script>
</body>

</html>
