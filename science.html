<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Science Station</title>
    <!-- 1. Include html2canvas library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        #downloadBtn {
            display: none;
            width: 100%;
            background-color: #64748b;
            color: white;
            padding: 15px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
            transition: background 0.3s ease;
        }

        #downloadBtn:hover {
            background-color: #475569;
        }
    </style>
</head>

<body>
    <button class="menu-toggle" onclick="toggleMenu()">☰</button>
    <div id="overlay" class="overlay" onclick="toggleMenu()"></div>
<div class="navbar" id="sideNav">
    <div class="navbar-title">
        <img src="image/title.png" alt="Growtopia" class="navbar-logo">
        <span class="navbar-title-text">Calculator</span>
        <img src="image/profile.jpg" alt="Profile" class="navbar-profile">
        <span class="subtitle">by TDoomGT</span>
    </div>
    <div class="nav-links">
        <a href="index.html" class="nav-link" id="nav-home">
            <i><img src="image/home.png" alt="Home" style="width: 22px;"></i>
            <span class="nav-text">Home</span>
        </a>
        <a href="uranium.html" class="nav-link" id="nav-uranium"><i><img src="image/uranium_fishing/uranium_nav.png" alt="Uranium"></i><span class="nav-text">Uranium Fishing</span></a>
        <a href="pepper.html" class="nav-link" id="nav-pepper"><i><img src="image/pepper_recycling/pepper_nav.png" alt="Pepper"></i><span class="nav-text">Pepper Recycling</span></a>
        <a href="science.html" class="nav-link" id="nav-science"><i><img src="image/science_station/science_nav.png" alt="Science"></i><span class="nav-text">Science Station</span></a>
        <a href="tackle.html" class="nav-link" id="nav-tackle"><i><img src="image/tackle_box/tackle_nav.png" alt="Tackle"></i><span class="nav-text">Tackle Box</span></a>
        <a href="autoclave.html" class="nav-link" id="nav-autoclave"><i><img src="image/auto_clave/autoclave_nav.png" alt="Autoclave"></i><span class="nav-text">Autoclave</span></a>
    </div>
</div>

    <div class="container">
        <h1>Science Station</h1>

        <div class="input-grid">
            <div class="input-group">
                <label>Amount of Stations:</label>
                <input type="number" id="sci_amt" value="5300">
            </div>
            <div class="input-group">
                <label>Fuel Pack Rate (qty/wl):</label>
                <input type="text" id="sci_fuel_rate" value="2/1">
            </div>
            <div class="input-group">
                <label>Convert to M-Chem?</label>
                <select id="make_mchem">
                    <option value="Y">Yes</option>
                    <option value="N">No</option>
                </select>
            </div>
            <div class="input-group">
                <label>Convert to Fuel?</label>
                <select id="make_fuel">
                    <option value="Y">Yes</option>
                    <option value="N">No</option>
                </select>
            </div>
        </div>

        <button onclick="calcScience()">Calculate</button>
        <!-- 2. Add Download Button -->
        <button id="downloadBtn" onclick="downloadResult()">Download Result as Image</button>

        <p style="font-size:0.82em; color:#94a3b8; margin-top:12px; line-height:1.4;">
            Note: the percentage for each chemical drop rate is obtained from <a
                href="https://jscalc.io/calc/OubIbEPKk4CmLPV5" target="_blank" rel="noopener noreferrer"
                style="color:#7dd3fc; text-decoration:underline;">jscalc.io</a>.
        </p>

        <div id="sci_res" class="result-box"></div>
    </div>

    <script>
        function parseRatio(str) {
            if (str.includes('/')) {
                const p = str.split('/');
                return parseFloat(p[1]) / parseFloat(p[0]);
            }
            return 1 / parseFloat(str);
        }

        function calcScience() {
            const stations = parseFloat(document.getElementById('sci_amt').value) || 0;
            const fuelRate = parseRatio(document.getElementById('sci_fuel_rate').value);
            const choiceM = document.getElementById('make_mchem').value === 'Y';
            const choiceF = document.getElementById('make_fuel').value === 'Y';

            let y = stations * 0.15;
            let b = stations * 0.13;
            let p = stations * 0.07;
            let g = stations * 0.40;
            let r = stations * 0.25;

            let mChem = 0;
            let fuelPacks = 0;

            if (choiceM) {
                mChem = Math.floor(Math.min(y / 20, b / 10, p / 5));
                y -= (mChem * 20);
                b -= (mChem * 10);
                p -= (mChem * 5);
            }

            if (choiceF && mChem > 0) {
                fuelPacks = Math.floor(Math.min(mChem, g / 10, b / 2));
                mChem -= fuelPacks;
                g -= (fuelPacks * 10);
                b -= (fuelPacks * 2);
            }

            const wlValue = fuelPacks * fuelRate;

            const res = document.getElementById('sci_res');
            const dlBtn = document.getElementById('downloadBtn');

            res.style.display = 'block';
            dlBtn.style.display = 'block'; // Show download button

            res.innerHTML = `
                <h3 style="text-align:center; margin-bottom:15px; border-bottom: 1px solid #334155; padding-bottom: 10px;">FINAL SUMMARY</h3>
                <div class="result-item" style="display: flex; justify-content: space-between;"><span>Fuel Packs:</span><span>${fuelPacks}</span></div>
                <div class="result-item" style="display: flex; justify-content: space-between;"><span>Leftover M-Chems:</span><span>${mChem}</span></div>
                <hr style="border:0; border-top:1px solid #334155; margin:10px 0;">
                <div class="result-item" style="display: flex; justify-content: space-between;"><span>Leftover Yellow:</span><span>${Math.floor(y)}</span></div>
                <div class="result-item" style="display: flex; justify-content: space-between;"><span>Leftover Blue:</span><span>${Math.floor(b)}</span></div>
                <div class="result-item" style="display: flex; justify-content: space-between;"><span>Leftover Pink:</span><span>${Math.floor(p)}</span></div>
                <div class="result-item" style="display: flex; justify-content: space-between;"><span>Leftover Green:</span><span>${Math.floor(g)}</span></div>
                <div class="result-item" style="display: flex; justify-content: space-between;"><span>Leftover Red:</span><span>${Math.floor(r)}</span></div>
                <div class="profit-text" style="text-align: right; color: #4ade80; font-weight: bold; font-size: 1.2em; margin-top: 15px;">EST. VALUE: ${wlValue.toFixed(1)} WL</div>
            `;
        }

        // 3. Add Download Function
        function downloadResult() {
            const resultBox = document.getElementById('sci_res');
            const exportBg = "#0f172a";

            html2canvas(resultBox, {
                backgroundColor: exportBg,
                scale: 3,
                logging: false,
                useCORS: true,
                onclone: (clonedDoc) => {
                    const clonedRes = clonedDoc.getElementById('sci_res');
                    clonedRes.style.display = 'block';
                    clonedRes.style.background = exportBg;
                    clonedRes.style.padding = '25px';
                    clonedRes.style.animation = 'none';

                    const items = clonedRes.querySelectorAll('.result-item');
                    items.forEach(item => {
                        item.style.opacity = '1';
                        item.style.display = 'flex';
                        item.style.justifyContent = 'space-between';
                        item.style.visibility = 'visible';
                        const currentColor = window.getComputedStyle(item).color;
                        item.style.color = currentColor;
                    });
                }
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = 'science_station_report.png';
                link.href = canvas.toDataURL("image/png", 1.0);
                link.click();
            });
        }
    </script>
    <script>
// 1. Find and REMOVE your old line: 
// const currentPage = (window.location.pathname.split('/').pop() || 'index.html').split('?')[0];

// 2. PASTE this smarter version in its place:
const navLinks = document.querySelectorAll('.nav-link');
let currentPage = window.location.pathname.split('/').pop();

// This part handles GitHub's folder naming (growtopia-calculator)
if (currentPage === '' || currentPage === 'growtopia-calculator') {
    currentPage = 'index.html';
}

navLinks.forEach(link => {
    const linkHref = link.getAttribute('href');
    if (linkHref === currentPage) {
        link.classList.add('active');
    } else {
        link.classList.remove('active');
    }
});
    </script>
    <script>
        function toggleMenu() {
            const nav = document.getElementById('sideNav');
            const overlay = document.getElementById('overlay');
            const btn = document.querySelector('.menu-toggle');

            // Toggle the 'active' class for both
            nav.classList.toggle('active');
            overlay.classList.toggle('active');

            // Update the button icon
            btn.innerHTML = nav.classList.contains('active') ? '✕' : '☰';
        }
    </script>
</body>

</html>
