    <meta charset="UTF-8">

    <style>
        .search-container {
            margin-bottom: 25px;
            display: flex;
            gap: 10px;
        }

        .search-container input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: #0f172a;
            color: white;
            font-size: 1em;
            outline: none;
        }

        .search-container input:focus {
            border-color: var(--accent);
        }

        /* --- STABLE HORIZONTAL PURE FLEX TREE DIAGRAM --- */
        .tree-container-wrapper {
            width: 100%;
            overflow-x: auto;
            padding: 40px 10px;
        }

        .tree-root {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            min-width: max-content;
        }

        /* Container that pairs the ingredients side-by-side with its output item */
        .tree-node {
            display: flex;
            align-items: center;
        }

        /* Container stacking the two ingredients vertically */
        .node-parents {
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
        }

        /* Individual rows for each parent recipe branch */
        .parent-branch-row {
            display: flex;
            align-items: center;
            position: relative;
        }

        /* --- NATIVE ACCURATE CONNECTING LINES --- */
        .line-connector-wrapper {
            display: flex;
            align-items: center;
            width: 40px;
            /* Uniform width for all line gaps */
            align-self: stretch;
        }

        /* The vertical backbone spine line */
        .spine-line {
            width: 2px;
            background-color: var(--border);
            align-self: stretch;
        }

        /* Trims the top and bottom ends of the vertical spine lines cleanly */
        .parent-branch-row:first-child .spine-line {
            margin-top: 50%;
        }

        .parent-branch-row:last-child .spine-line {
            margin-bottom: 50%;
        }

        /* The horizontal branch lines entering and leaving nodes */
        .horizontal-line {
            height: 2px;
            background-color: var(--border);
            flex-grow: 1;
        }

        /* Target Output Block Label Formatting */
        .node-label {
            background: #0f172a;
            border: 2px solid var(--border);
            border-radius: 8px;
            padding: 12px 18px;
            color: var(--text);
            font-weight: bold;
            font-size: 0.95em;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.15);
            z-index: 2;
            min-width: 160px;
            max-width: 200px;
            word-wrap: break-word;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .node-label.active-node {
            border-color: var(--accent);
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
        }

        .empty-msg {
            text-align: center;
            color: #94a3b8;
            margin-top: 40px;
            font-style: italic;
        }

        /* Autocomplete Dropdown Search Box */
        .autocomplete-suggestions {
            position: absolute;
            background: #1e293b;
            border: 1px solid var(--border);
            border-radius: 8px;
            max-height: 200px;
            overflow-y: auto;
            width: 100%;
            z-index: 100;
            margin-top: 5px;
            box-shadow: 0 10px 15px rgba(0, 0, 0, 0.5);
        }

        .suggestion-item {
            padding: 10px 15px;
            cursor: pointer;
            color: #cbd5e1;
        }

        .suggestion-item:hover {
            background: rgba(56, 189, 248, 0.15);
            color: var(--accent);
        }
    </style>
</head>

        const searchInput = document.getElementById('itemSearch');
        const suggestionsBox = document.getElementById('suggestions');
        const treeRoot = document.getElementById('treeRoot');
        const emptyMsg = document.getElementById('emptyMsg');

        function capitalize(str) {
            return str.replace(/\b\w/g, c => c.toUpperCase());
        }

        // Input search filtering listener
        searchInput.addEventListener('input', () => {
            const query = searchInput.value.toLowerCase().trim();
            suggestionsBox.innerHTML = '';

            if (!query) {
                suggestionsBox.style.display = 'none';
                return;
            }

            const filteredKeys = Object.keys(recipes).filter(key => key.includes(query));

            if (filteredKeys.length === 0) {
                suggestionsBox.style.display = 'none';
                return;
            }

            filteredKeys.forEach(key => {
                const div = document.createElement('div');
                div.className = 'suggestion-item';
                div.textContent = capitalize(key);
                div.addEventListener('click', () => {
                    searchInput.value = capitalize(key);
                    suggestionsBox.style.display = 'none';
                    generateTree(key);
                });
                suggestionsBox.appendChild(div);
            });

            suggestionsBox.style.display = 'block';
        });

        document.addEventListener('click', (e) => {
            if (e.target !== searchInput) suggestionsBox.style.display = 'none';
        });

        // Recursive horizontal native structural tree compiler
        function buildTreeNodeHTML(itemName, isRootNode = false) {
            const cleanName = itemName.toLowerCase().trim();
            const itemData = recipes[cleanName] || {};

            const nodeElement = document.createElement('div');
            nodeElement.className = 'tree-node';

            // If it has cross-breeding ingredients, compile them on the left
            if (itemData.parents && itemData.parents.length === 2) {
                const parentsContainer = document.createElement('div');
                parentsContainer.className = 'node-parents';

                itemData.parents.forEach((parentName) => {
                    const branchRow = document.createElement('div');
                    branchRow.className = 'parent-branch-row';

                    // Build nested child structures recursively
                    const parentNode = buildTreeNodeHTML(parentName);
                    branchRow.appendChild(parentNode);

                    // Create the structural connector tracking box
                    const connectorWrapper = document.createElement('div');
                    connectorWrapper.className = 'line-connector-wrapper';

                    const spine = document.createElement('div');
                    spine.className = 'spine-line';

                    const horizon = document.createElement('div');
                    horizon.className = 'horizontal-line';

                    connectorWrapper.appendChild(spine);
                    connectorWrapper.appendChild(horizon);
                    branchRow.appendChild(connectorWrapper);

                    parentsContainer.appendChild(branchRow);
                });

                nodeElement.appendChild(parentsContainer);
            }

            // Target Node Box Label (If it's an ingredient on the far left, add an entry stub line)
            if (!isRootNode && (!itemData.parents || itemData.parents.length === 0)) {
                const entryLine = document.createElement('div');
                entryLine.className = 'horizontal-line';
                entryLine.style.width = '20px';
                entryLine.style.flexGrow = '0';
                nodeElement.appendChild(entryLine);
            }

            const label = document.createElement('div');
            label.className = `node-label ${isRootNode ? 'active-node' : ''}`;
            label.textContent = capitalize(itemName);
            nodeElement.appendChild(label);

            return nodeElement;
        }

        function generateTree(itemKey) {
            emptyMsg.style.display = 'none';
            treeRoot.innerHTML = '';

            const dynamicTreeHTML = buildTreeNodeHTML(itemKey, true);
            treeRoot.appendChild(dynamicTreeHTML);
        }

        function toggleMenu() {
            const nav = document.getElementById('sideNav');
            const overlay = document.getElementById('overlay');
            const btn = document.querySelector('.menu-toggle');
            nav.classList.toggle('active');
            overlay.classList.toggle('active');
            btn.innerHTML = nav.classList.contains('active') ? '✕' : '☰';
        }
    </script>
