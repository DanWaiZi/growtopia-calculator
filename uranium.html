<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Uranium Fishing</title>
    <!-- 1. Library Integration -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        /* Styling for the Download Button */
        #downloadBtn {
            display: none; /* Hidden until calculation is done */
            width: 100%;
            background-color: #64748b; /* Subtle grey-blue accent */
            color: white;
            padding: 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
            transition: background 0.3s ease;
        }

        #downloadBtn:hover {
            background-color: #475569;
        }

        /* Ensure the result box has a defined background for the screenshot */
        .result-box {
            background-color: #0a192f; 
            border-radius: 8px;
            padding: 20px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
<div class="navbar">
    <div class="navbar-title">
        <img src="image/title.png" alt="Growtopia" class="navbar-logo">
        <span class="navbar-title-text">Calculator</span>
        <img src="image/profile.jpg" alt="Profile" class="navbar-profile">
        <span class="subtitle">by TDoomGT</span>
    </div>
    <div class="nav-links">
        <a href="index.html" class="nav-link" id="nav-dashboard"><span class="nav-text">Dashboard</span></a>
        <a href="uranium.html" class="nav-link" id="nav-uranium"><i><img src="image/uranium_fishing/uranium_nav.png" alt="Uranium"></i><span class="nav-text">Uranium Fishing</span></a>
        <a href="pepper.html" class="nav-link" id="nav-pepper"><i><img src="image/pepper_recycling/pepper_nav.png" alt="Pepper"></i><span class="nav-text">Pepper Recycling</span></a>
        <a href="science.html" class="nav-link" id="nav-science"><i><img src="image/science_station/science_nav.png" alt="Science"></i><span class="nav-text">Science Station</span></a>
        <a href="tackle.html" class="nav-link" id="nav-tackle"><i><img src="image/tackle_box/tackle_nav.png" alt="Tackle"></i><span class="nav-text">Tackle Box</span></a>
        <a href="autoclave.html" class="nav-link" id="nav-autoclave"><i><img src="image/auto_clave/autoclave_nav.png" alt="Autoclave"></i><span class="nav-text">Autoclave</span></a>
    </div>
</div>

    <div class="container">
        <h1>Uranium Fishing</h1>
        <p style="text-align: center; color: var(--accent); font-size: 0.85em; margin-top: -15px; margin-bottom: 20px;">
            Note: This calculator is specifically for <strong>Thanksgiving Rod</strong> results.
        </p>
        
        <div class="input-grid">
            <div class="input-group">
                <label>Amount of Baits:</label>
                <input type="number" id="bait_amt" value="200">
            </div>
            <div class="input-group">
                <label>Bait Price (qty/wl):</label>
                <input type="text" id="prc_bait" value="16/1">
            </div>

            <div class="input-group">
                <label>Use Trawler?</label>
                <select id="use_trawl">
                    <option value="Y">Yes (8s per bait)</option>
                    <option value="N">No (10s per bait)</option>
                </select>
            </div>
            <div class="input-group">
                <label>Trawler Price (qty/wl):</label>
                <input type="text" id="prc_trawl" value="1/9">
            </div>

            <div class="input-group"><label>Whizmo (qty/wl):</label><input type="text" id="prc_whizmo" value="1/10"></div>
            <div class="input-group"><label>Brainworm (qty/wl):</label><input type="text" id="prc_brain" value="1/10"></div>
            <div class="input-group"><label>Ooze (qty/wl):</label><input type="text" id="prc_ooze" value="1/13"></div>
            <div class="input-group"><label>Normal Fish (qty/wl):</label><input type="text" id="prc_fish_norm" value="300/1"></div>
            <div class="input-group"><label>Perfect Fish (qty/wl):</label><input type="text" id="prc_fish_perf" value="1/2"></div>
            <div class="input-group"><label>Nuclear Detonator (qty/wl):</label><input type="text" id="prc_detonator" value="1/1"></div>
        </div>

        <button onclick="calcUranium()">Calculate</button>
        <!-- 2. Button UI -->
        <button id="downloadBtn" onclick="downloadResult()">Download Result as Image</button>

        <div id="ura_res" class="result-box" style="display: none;"></div>
    </div>

    <script>
        function parseRatio(str) {
            if (str.includes('/')) {
                const parts = str.split('/');
                return parseFloat(parts[1]) / parseFloat(parts[0]);
            }
            return parseFloat(str) || 0;
        }

        function calcUranium() {
            const res = document.getElementById('ura_res');
            const downloadBtn = document.getElementById('downloadBtn');
            
            // Re-trigger animation
            res.style.display = 'none';
            res.offsetHeight; 
            res.style.display = 'block';
            downloadBtn.style.display = 'block'; // Show download button

            const bait_amt = parseFloat(document.getElementById('bait_amt').value) || 0;
            const trawler_choice = document.getElementById('use_trawl').value;
            
            let seconds = (trawler_choice === "Y") ? 8 * bait_amt : 10 * bait_amt;
            let trawler_amount = (trawler_choice === "Y") ? 0.005 * bait_amt : 0;
            let total_trawler_wl = trawler_amount * parseRatio(document.getElementById('prc_trawl').value);
            
            const hours = Math.floor(seconds / 3600);
            const minutes = Math.floor((seconds % 3600) / 60);
            const remain_seconds = seconds % 60;

            const total_bait_wl = bait_amt * parseRatio(document.getElementById('prc_bait').value);
            const detonator_qty = Math.floor(bait_amt * 0.05);
            const total_detonator_wl = detonator_qty * parseRatio(document.getElementById('prc_detonator').value);
            const total_expenses = total_bait_wl + total_trawler_wl + total_detonator_wl;

            const qtyWhiz = Math.floor(bait_amt * 0.005);
            const qtyBrain = Math.floor(bait_amt * 0.03);
            const qtyOoze = Math.floor(bait_amt * 0.03);

            const valWhiz = qtyWhiz * parseRatio(document.getElementById('prc_whizmo').value);
            const valBrain = qtyBrain * parseRatio(document.getElementById('prc_brain').value);
            const valOoze = qtyOoze * parseRatio(document.getElementById('prc_ooze').value);

            const total_fish_qty = Math.floor(bait_amt * 0.935);
            const qtyFishNorm = Math.floor(total_fish_qty * 0.99);
            const qtyFishPerf = Math.floor(total_fish_qty * 0.01);

            const valFishNorm = qtyFishNorm * parseRatio(document.getElementById('prc_fish_norm').value);
            const valFishPerf = qtyFishPerf * parseRatio(document.getElementById('prc_fish_perf').value);
            const total_fish_val = valFishNorm + valFishPerf;

            const net_profit = (valWhiz + valBrain + valOoze + total_fish_val) - total_expenses;

            res.innerHTML = `
                <h3 style="text-align:center; border-bottom: 1px solid #334155; padding-bottom: 10px; margin-top: 0;">FINAL SUMMARY</h3>
                
                <div class="result-item" style="display: flex; justify-content: space-between; color: #38bdf8; margin-bottom: 5px;">
                    <span>Total Time:</span><span>${hours}h ${minutes}m ${remain_seconds}s</span>
                </div>
                
                <div class="result-item" style="display: flex; justify-content: space-between; font-weight: bold; color: #f87171; margin-top: 10px;">
                    <span>TOTAL EXPENSES:</span><span>${total_expenses.toFixed(1)} WL</span>
                </div>
                <div class="result-item" style="display: flex; justify-content: space-between; padding-left: 15px; font-size: 0.9em; opacity: 0.8;">
                    <span>• Baits (${bait_amt}):</span><span>${total_bait_wl.toFixed(1)} WL</span>
                </div>
                <div class="result-item" style="display: flex; justify-content: space-between; padding-left: 15px; font-size: 0.9em; opacity: 0.8;">
                    <span>• Trawler (${trawler_amount.toFixed(1)}):</span><span>${total_trawler_wl.toFixed(1)} WL</span>
                </div>
                <div class="result-item" style="display: flex; justify-content: space-between; padding-left: 15px; font-size: 0.9em; opacity: 0.8;">
                    <span>• Detonators (${detonator_qty}):</span><span>${total_detonator_wl.toFixed(1)} WL</span>
                </div>
                
                <div class="result-item" style="display: flex; justify-content: space-between; font-weight: bold; color: #4ade80; margin-top: 10px;">
                    <span>TOTAL INCOME:</span><span>${(valWhiz + valBrain + valOoze + total_fish_val).toFixed(1)} WL</span>
                </div>
                <div class="result-item" style="display: flex; justify-content: space-between; margin-bottom: 2px;"><span>Brain Worms (~${qtyBrain}):</span><span>${valBrain.toFixed(1)} WL</span></div>
                <div class="result-item" style="display: flex; justify-content: space-between; margin-bottom: 2px;"><span>Wizmo Gizmo (~${qtyWhiz}):</span><span>${valWhiz.toFixed(1)} WL</span></div>
                <div class="result-item" style="display: flex; justify-content: space-between; margin-bottom: 2px;"><span>Ooze (~${qtyOoze}):</span><span>${valOoze.toFixed(1)} WL</span></div>
                <div class="result-item" style="display: flex; justify-content: space-between; margin-bottom: 2px;"><span>Normal Fish (~${qtyFishNorm}):</span><span>${valFishNorm.toFixed(1)} WL</span></div>
                <div class="result-item" style="display: flex; justify-content: space-between; margin-bottom: 2px;"><span>Perfect Fish (~${qtyFishPerf}):</span><span>${valFishPerf.toFixed(1)} WL</span></div>
                
                <hr style="border:0; border-top:1px solid #334155; margin:10px 0;">
                
                <div class="result-item" style="display: flex; justify-content: space-between; color: ${net_profit >= 0 ? '#4ade80' : '#f87171'}; font-weight: bold; font-size: 1.2em;">
                    <span>NET PROFIT:</span><span>${net_profit.toFixed(1)} WL</span>
                </div>
            `;
        }

function downloadResult() {
    const resultBox = document.getElementById('ura_res');
    const exportBg = "#0f172a"; 

    html2canvas(resultBox, {
        backgroundColor: exportBg,
        scale: 3,                   
        logging: false,
        useCORS: true,
        allowTaint: true,
        onclone: (clonedDoc) => {
            const clonedRes = clonedDoc.getElementById('ura_res');
            
            // Force container stability
            clonedRes.style.display = 'block';
            clonedRes.style.background = exportBg;
            clonedRes.style.padding = '25px';
            clonedRes.style.animation = 'none';
            
            // Fix visibility without overriding specific colors
            const items = clonedRes.querySelectorAll('.result-item');
            items.forEach(item => {
                item.style.opacity = '1';
                item.style.display = 'flex';
                item.style.justifyContent = 'space-between';
                item.style.visibility = 'visible';
                
                // If a specific color was set inline (like red/green), 
                // html2canvas needs it to be 100% opaque.
                const currentColor = window.getComputedStyle(item).color;
                item.style.color = currentColor; 
            });

            // Ensure the header line is visible
            const header = clonedRes.querySelector('h3');
            if (header) {
                header.style.borderBottom = '1px solid #334155';
            }
        }
    }).then(canvas => {
        const link = document.createElement('a');
        link.download = 'uranium_fishing_report.png';
        link.href = canvas.toDataURL("image/png", 1.0);
        link.click();
    });
}

        // Navigation Active State Logic
        const navLinks = document.querySelectorAll('.nav-link');
        const currentPage = (window.location.pathname.split('/').pop() || 'index.html').split('?')[0];

        navLinks.forEach(link => {
            const linkHref = link.getAttribute('href');
            if (linkHref === currentPage) {
                link.classList.add('active');
            }
        });
    </script>
</body>
</html>
