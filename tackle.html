<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/x-icon" href="image/profile.jpg">
    <title>Tackle Box</title>
    <!-- 1. Library Integration -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        #downloadBtn {
            display: none;
            width: 100%;
            background-color: #64748b;
            color: white;
            padding: 15px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
            transition: background 0.3s ease;
        }

        #downloadBtn:hover {
            background-color: #475569;
        }
    </style>
</head>

<body>
    <button class="menu-toggle" onclick="toggleMenu()">☰</button>
    <div id="overlay" class="overlay" onclick="toggleMenu()"></div>
    <div class="navbar" id="sideNav">
        <div class="navbar-title">
            <img src="image/title.png" alt="Growtopia" class="navbar-logo">
            <span class="navbar-title-text">Calculator</span>
            <img src="image/profile.jpg" alt="Profile" class="navbar-profile">
            <span class="subtitle">by TDoomGT</span>
        </div>
        <div class="nav-links">
            <a href="index.html" class="nav-link" id="nav-home"><i><img src="image/home.png" alt="Home"></i><span class="nav-text">Home</span></a>
            <a href="recipe.html" class="nav-link" id="nav-recipe"><i><img src="image/science_station/science_nav.png" alt="Recipe"></i><span class="nav-text">Seed Recipe</span></a>
            <a href="fishing.html" class="nav-link" id="nav-fishing"><i><img src="image/fishing/fishing_nav.png" alt="Fishing"></i><span class="nav-text">Fishing</span></a>
            <a href="pepper.html" class="nav-link" id="nav-pepper"><i><img src="image/pepper_recycling/pepper_nav.png" alt="Pepper"></i><span class="nav-text">Pepper</span></a>
            <a href="science.html" class="nav-link" id="nav-science"><i><img src="image/science_station/science_nav.png" alt="Science"></i><span class="nav-text">Science Station</span></a>
            <a href="tackle.html" class="nav-link" id="nav-tackle"><i><img src="image/tackle_box/tackle_nav.png" alt="Tackle"></i><span class="nav-text">Tackle Box</span></a>
            <a href="autoclave.html" class="nav-link" id="nav-autoclave"><i><img src="image/autoclave/autoclave_nav.png" alt="Autoclave"></i><span class="nav-text">Autoclave</span></a>
        </div>
    </div>

    <div class="container">
        <h1>Tackle Box</h1>
        <div class="input-group">
            <label><i><img src="image/tackle_box/tackle_nav.png" alt="Tackle"></i>Amount of Boxes</label>
            <input type="number" id="tack_amt" value="5300">
        </div>
        <div id="tackle_price_inputs" class="input-grid"></div>
        <button onclick="calcTackle()">Calculate</button>
        <!-- 2. Download Button -->
        <button id="downloadBtn" onclick="downloadResult()">Download Result as Image</button>
        <div id="tack_res" class="result-box"></div>
    </div>

    <script>
        function toggleMenu() {
            const nav = document.getElementById('sideNav');
            const overlay = document.getElementById('overlay');
            const btn = document.querySelector('.menu-toggle');

            // Toggle the 'active' class for both
            nav.classList.toggle('active');
            overlay.classList.toggle('active');

            // Update the button icon
            btn.innerHTML = nav.classList.contains('active') ? '✕' : '☰';
        }

        // Close menu automatically when a link is clicked
        document.querySelectorAll('.nav-link').forEach(link => {
            link.addEventListener('click', () => {
                document.getElementById('sideNav').classList.remove('active');
                document.querySelector('.menu-toggle').innerHTML = '☰ Menu';
            });
        });
        // 🔧 Updated with your new Percentages
        const tackleBaitData = [
            { id: 'wiggly_worm', label: 'Wiggly Worm', image: 'wiggly_worm.png', percent: 0.30, default: '1000/1' },
            { id: 'shiny_flashy_thing', label: 'Shiny Flashy Thing', image: 'shiny_flashy_thing.png', percent: 0.25, default: '200/1' },
            { id: 'salmon_eggs', label: 'Salmon Eggs', image: 'salmon_eggs.png', percent: 0.20, default: '600/1' },
            { id: 'fishing_fly', label: 'Fishing Fly', image: 'fishing_fly.png', percent: 0.13, default: '20/1' },
            { id: 'shrimp_lure', label: 'Shrimp Lure', image: 'shrimp_lure.png', percent: 0.06, default: '1/3' },
            { id: 'mega_pellet', label: 'Mega Pellet', image: 'mega-pellet_bait.png', percent: 0.03, default: '17/1' },
            { id: 'uranium_lure', label: 'Uranium Lure', image: 'uranium_glowing_lure.png', percent: 0.03, default: '17/1' }
        ];

        const inputDiv = document.getElementById('tackle_price_inputs');
        tackleBaitData.forEach(bait => {
            inputDiv.innerHTML += `<div class="input-group"><label><img src="image/tackle_box/${bait.image}" alt="${bait.label}">${bait.label}</label><input type="text" id="tack_pr_${bait.id}" value="${bait.default}"></div>`;
        });

        function parseRatio(str) {
            if (str.includes('/')) {
                const p = str.split('/');
                return parseFloat(p[1]) / parseFloat(p[0]);
            }
            return 1 / parseFloat(str);
        }

        function calcTackle() {
            const amt = parseFloat(document.getElementById('tack_amt').value) || 0;
            const res = document.getElementById('tack_res');
            const downloadBtn = document.getElementById('downloadBtn');
            let totalWL = 0, html = "";

            tackleBaitData.forEach(bait => {
                const expected = Math.floor(amt * bait.percent);
                const price = parseRatio(document.getElementById(`tack_pr_${bait.id}`).value);
                const value = expected * price;
                totalWL += value;

                if (expected > 0) {
                    html += `
<div class="result-item" style="display: flex; justify-content: space-between; align-items: center; padding: 5px 0; border-bottom: 1px solid #334155;">
    <span style="font-weight: bold; color: #94a3b8;">${bait.label} <small>(${(bait.percent * 100).toFixed(0)}%)</small></span>
    <span style="text-align: right; color: white;">~${expected} qty <br> <b style="color:#4ade80">(${value.toFixed(1)} WL)</b></span>
</div>`;
                }
            });

            res.style.display = 'block';
            downloadBtn.style.display = 'block';
            res.innerHTML = `
                <h3 style="text-align:center; border-bottom: 1px solid #334155; padding-bottom: 10px; margin-top: 0;">TACKLE SUMMARY</h3>
                ${html}
                <hr style="border:0; border-top:1px solid #334155; margin:10px 0;">
                <div class="result-item" style="display: flex; justify-content: space-between; color: #4ade80; font-weight: bold; font-size: 1.2em;">
                    <span>TOTAL REVENUE:</span><span>${totalWL.toFixed(2)} WL</span>
                </div>
            `;
        }

        // 3. Robust Download Logic
        function downloadResult() {
            const resultBox = document.getElementById('tack_res');
            const exportBg = "#0f172a";

            html2canvas(resultBox, {
                backgroundColor: exportBg,
                scale: 3,
                logging: false,
                useCORS: true,
                onclone: (clonedDoc) => {
                    const clonedRes = clonedDoc.getElementById('tack_res');
                    clonedRes.style.display = 'block';
                    clonedRes.style.background = exportBg;
                    clonedRes.style.padding = '25px';
                    clonedRes.style.animation = 'none';

                    const items = clonedRes.querySelectorAll('.result-item');
                    items.forEach(item => {
                        item.style.opacity = '1';
                        item.style.display = 'flex';
                        item.style.justifyContent = 'space-between';
                        item.style.visibility = 'visible';
                        const currentColor = window.getComputedStyle(item).color;
                        item.style.color = currentColor;
                    });
                }
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = 'tackle_box_report.png';
                link.href = canvas.toDataURL("image/png", 1.0);
                link.click();
            });
        }

        // Navigation Active State
        // 1. Find and REMOVE your old line: 
        // const currentPage = (window.location.pathname.split('/').pop() || 'index.html').split('?')[0];

        // 2. PASTE this smarter version in its place:
        const navLinks = document.querySelectorAll('.nav-link');
        let currentPage = window.location.pathname.split('/').pop();

        // This part handles GitHub's folder naming (growtopia-calculator)
        if (currentPage === '' || currentPage === 'growtopia-calculator') {
            currentPage = 'index.html';
        }

        navLinks.forEach(link => {
            const linkHref = link.getAttribute('href');
            if (linkHref === currentPage) {
                link.classList.add('active');
            } else {
                link.classList.remove('active');
            }
        });
    </script>
</body>

</html>
