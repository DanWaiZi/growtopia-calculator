<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Tackle Box</title>
    <!-- 1. Library Integration -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        #downloadBtn {
            display: none;
            width: 100%;
            background-color: #64748b;
            color: white;
            padding: 15px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
            transition: background 0.3s ease;
        }
        #downloadBtn:hover { background-color: #475569; }
    </style>
</head>
<body>
    
<!-- Mobile Menu Button -->
<button class="menu-toggle" onclick="toggleMenu()">☰ Menu</button>

<div class="navbar" id="sideNav">
    <div class="navbar-title">
        <img src="image/title.png" alt="Growtopia" class="navbar-logo">
        <span class="navbar-title-text">Calculator</span>
        <img src="image/profile.jpg" alt="Profile" class="navbar-profile">
        <span class="subtitle">by TDoomGT</span>
    </div>
    <div class="nav-links">
        <a href="index.html" class="nav-link" id="nav-dashboard"><span class="nav-text">Dashboard</span></a>
        <a href="uranium.html" class="nav-link" id="nav-uranium"><i><img src="image/uranium_fishing/uranium_nav.png" alt="Uranium"></i><span class="nav-text">Uranium Fishing</span></a>
        <a href="pepper.html" class="nav-link" id="nav-pepper"><i><img src="image/pepper_recycling/pepper_nav.png" alt="Pepper"></i><span class="nav-text">Pepper Recycling</span></a>
        <a href="science.html" class="nav-link" id="nav-science"><i><img src="image/science_station/science_nav.png" alt="Science"></i><span class="nav-text">Science Station</span></a>
        <a href="tackle.html" class="nav-link" id="nav-tackle"><i><img src="image/tackle_box/tackle_nav.png" alt="Tackle"></i><span class="nav-text">Tackle Box</span></a>
        <a href="autoclave.html" class="nav-link" id="nav-autoclave"><i><img src="image/auto_clave/autoclave_nav.png" alt="Autoclave"></i><span class="nav-text">Autoclave</span></a>
    </div>
</div>

    <div class="container">
        <h1>Tackle Box</h1>
        <div class="input-group">
            <label>Amount of Boxes</label>
            <input type="number" id="tack_amt" value="5300">
        </div>
        <div id="tackle_price_inputs" class="input-grid"></div>
        <button onclick="calcTackle()">Calculate</button>
        <!-- 2. Download Button -->
        <button id="downloadBtn" onclick="downloadResult()">Download Result as Image</button>
        <div id="tack_res" class="result-box"></div>
    </div>

    <script>
function toggleMenu() {
    const nav = document.getElementById('sideNav');
    nav.classList.toggle('active');
    
    const btn = document.querySelector('.menu-toggle');
    // Change button text so the user knows how to close it
    btn.innerHTML = nav.classList.contains('active') ? '✕ Close' : '☰ Menu';
}

// Close menu automatically when a link is clicked
document.querySelectorAll('.nav-link').forEach(link => {
    link.addEventListener('click', () => {
        document.getElementById('sideNav').classList.remove('active');
        document.querySelector('.menu-toggle').innerHTML = '☰ Menu';
    });
});
        // 🔧 Updated with your new Percentages
        const tackleBaitData = [
            { id: 'wiggly_worm', label: 'Wiggly Worm', image: 'wiggly_worm.png', percent: 0.30, default: '1000/1' },
            { id: 'shiny_flashy_thing', label: 'Shiny Flashy Thing', image: 'shiny_flashy_thing.png', percent: 0.25, default: '200/1' },
            { id: 'salmon_eggs', label: 'Salmon Eggs', image: 'salmon_eggs.png', percent: 0.20, default: '500/1' },
            { id: 'fishing_fly', label: 'Fishing Fly', image: 'fishing_fly.png', percent: 0.13, default: '20/1' },
            { id: 'shrimp_lure', label: 'Shrimp Lure', image: 'shrimp_lure.png', percent: 0.06, default: '1/3' },
            { id: 'mega_pellet', label: 'Mega Pellet', image: 'mega-pellet_bait.png', percent: 0.03, default: '16/1' },
            { id: 'uranium_lure', label: 'Uranium Lure', image: 'uranium_glowing_lure.png', percent: 0.03, default: '16/1' }
        ];

        const inputDiv = document.getElementById('tackle_price_inputs');
        tackleBaitData.forEach(bait => {
            inputDiv.innerHTML += `<div class="input-group"><label><img src="image/tackle_box/${bait.image}" alt="${bait.label}">${bait.label}</label><input type="text" id="tack_pr_${bait.id}" value="${bait.default}"></div>`;
        });

        function parseRatio(str) {
            if (str.includes('/')) {
                const p = str.split('/');
                return parseFloat(p[1]) / parseFloat(p[0]);
            }
            return 1 / parseFloat(str);
        }

        function calcTackle() {
            const amt = parseFloat(document.getElementById('tack_amt').value) || 0;
            const res = document.getElementById('tack_res');
            const downloadBtn = document.getElementById('downloadBtn');
            let totalWL = 0, html = "";

            tackleBaitData.forEach(bait => {
                const expected = Math.floor(amt * bait.percent);
                const price = parseRatio(document.getElementById(`tack_pr_${bait.id}`).value);
                const value = expected * price;
                totalWL += value;

                if (expected > 0) {
                    html += `
                    <div class="result-item" style="display: flex; justify-content: space-between; margin-bottom: 5px;">
                        <span>${bait.label} (${(bait.percent * 100).toFixed(0)}%)</span>
                        <span>~${expected} qty (${value.toFixed(1)} WL)</span>
                    </div>`;
                }
            });

            res.style.display = 'block';
            downloadBtn.style.display = 'block';
            res.innerHTML = `
                <h3 style="text-align:center; border-bottom: 1px solid #334155; padding-bottom: 10px; margin-top: 0;">TACKLE SUMMARY</h3>
                ${html}
                <hr style="border:0; border-top:1px solid #334155; margin:10px 0;">
                <div class="result-item" style="display: flex; justify-content: space-between; color: #4ade80; font-weight: bold; font-size: 1.2em;">
                    <span>TOTAL REVENUE:</span><span>${totalWL.toFixed(2)} WL</span>
                </div>
            `;
        }

        // 3. Robust Download Logic
        function downloadResult() {
            const resultBox = document.getElementById('tack_res');
            const exportBg = "#0f172a"; 

            html2canvas(resultBox, {
                backgroundColor: exportBg,
                scale: 3,
                logging: false,
                useCORS: true,
                onclone: (clonedDoc) => {
                    const clonedRes = clonedDoc.getElementById('tack_res');
                    clonedRes.style.display = 'block';
                    clonedRes.style.background = exportBg;
                    clonedRes.style.padding = '25px';
                    clonedRes.style.animation = 'none';
                    
                    const items = clonedRes.querySelectorAll('.result-item');
                    items.forEach(item => {
                        item.style.opacity = '1';
                        item.style.display = 'flex';
                        item.style.justifyContent = 'space-between';
                        item.style.visibility = 'visible';
                        const currentColor = window.getComputedStyle(item).color;
                        item.style.color = currentColor; 
                    });
                }
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = 'tackle_box_report.png';
                link.href = canvas.toDataURL("image/png", 1.0);
                link.click();
            });
        }

        // Navigation Active State
        const navLinks = document.querySelectorAll('.nav-link');
        const currentPage = (window.location.pathname.split('/').pop() || 'index.html').split('?')[0];
        navLinks.forEach(link => {
            if (link.getAttribute('href') === currentPage) link.classList.add('active');
        });
    </script>
</body>
</html>
