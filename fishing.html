<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Fishing Calculator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        #downloadBtn {
            display: none;
            width: 100%;
            background-color: #64748b;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
            transition: background 0.3s ease;
        }

        #downloadBtn:hover {
            background-color: #475569;
        }

        .result-box {
            background-color: #0a192f;
            border-radius: 8px;
            padding: 20px;
            margin-top: 20px;
        }

        .hidden-group {
            display: none;
        }

        /* --- MOBILE SCROLL LOCK --- */
        @media screen and (max-width: 768px) {

            body:has(.overlay.active),
            body:has(.navbar.active) {
                overflow: hidden !important;
                height: 100vh;
                touch-action: none;
            }
        }
    </style>
</head>

<body>
    <button class="menu-toggle" onclick="toggleMenu()">☰</button>
    <div id="overlay" class="overlay" onclick="toggleMenu()"></div>

    <div class="navbar" id="sideNav">
        <div class="navbar-title">
            <img src="image/title.png" alt="Growtopia" class="navbar-logo">
            <span class="navbar-title-text">Calculator</span>
            <img src="image/profile.jpg" alt="Profile" class="navbar-profile">
            <span class="subtitle">by TDoomGT</span>
        </div>
        <div class="nav-links">
            <a href="index.html" class="nav-link" id="nav-home">
                <i><img src="image/home.png" alt="Home" style="width: 22px;"></i>
                <span class="nav-text">Home</span>
            </a>
            <a href="fishing.html" class="nav-link" id="nav-fishing">
                <i><img src="image/fishing/fishing_nav.png" alt="Fishing"></i>
                <span class="nav-text">Fishing</span>
            </a>
            <a href="pepper.html" class="nav-link" id="nav-pepper">
                <i><img src="image/pepper_recycling/pepper_nav.png" alt="Pepper"></i>
                <span class="nav-text">Pepper Recycling</span>
            </a>
            <a href="science.html" class="nav-link" id="nav-science">
                <i><img src="image/science_station/science_nav.png" alt="Science"></i>
                <span class="nav-text">Science Station</span>
            </a>
            <a href="tackle.html" class="nav-link" id="nav-tackle">
                <i><img src="image/tackle_box/tackle_nav.png" alt="Tackle"></i>
                <span class="nav-text">Tackle Box</span>
            </a>
            <a href="autoclave.html" class="nav-link" id="nav-autoclave">
                <i><img src="image/autoclave/autoclave_nav.png" alt="Autoclave"></i>
                <span class="nav-text">Autoclave</span>
            </a>
        </div>
    </div>

    <div class="container">
        <h1>Fishing Calculator</h1>

        <div class="input-group" style="margin-bottom: 20px;">
            <label>Fishing Mode:</label>
            <select id="fishing_mode" onchange="toggleModeFields()"
                style="width: 100%; padding: 10px; border-radius: 8px; background: #1e293b; color: white; border: 1px solid #334155;">
                <option value="uranium">Uranium Lure (Thanksgiving Rod)</option>
                <option value="role7">Fishing Fly Level 7 (Normal Rod)</option>
            </select>
        </div>

        <div class="input-grid">
            <div class="input-group">
                <label><img src="image/tackle_box/wiggly_worm.png" alt="Bait">Amount of Baits:</label>
                <input type="number" id="bait_amt" value="200" min="1">
            </div>
            <div class="input-group">
                <label><img src="image/world_lock.png" alt="WL">Bait Price (qty/wl):</label>
                <input type="text" id="prc_bait" value="17/1">
            </div>
            <div class="input-group">
                <label><img src="image/fishing/trawler.png" alt="Trawler">Use Trawlerman's Friend?</label>
                <select id="use_trawl">
                    <option value="Y">Yes (8s Per Bait)</option>
                    <option value="N">No (10s Per Bait)</option>
                </select>
            </div>
            <div class="input-group">
                <label><img src="image/world_lock.png" alt="WL">Trawler Price (qty/wl):</label>
                <input type="text" id="prc_trawl" value="1/9">
            </div>

            <div class="input-group ura-field">
                <label><img src="image/fishing/whizmo_gizmo.png" alt="Whizmo">Whizmo (qty/wl):</label>
                <input type="text" id="prc_whizmo" value="1/12">
            </div>
            <div class="input-group ura-field">
                <label><img src="image/fishing/brainworm.png" alt="Brainworm">Brainworm (qty/wl):</label>
                <input type="text" id="prc_brain" value="1/13">
            </div>
            <div class="input-group ura-field">
                <label><img src="image/fishing/primordial_ooze.png" alt="Ooze">Primordial Ooze (qty/wl):</label>
                <input type="text" id="prc_ooze" value="1/15">
            </div>
            <div class="input-group ura-field">
                <label><img src="image/fishing/nuclear_detonator.png" alt="Detonator">Detonator (qty/wl):</label>
                <input type="text" id="prc_detonator" value="1/2">
            </div>
            <div class="input-group ura-field">
                <label><img src="image/fishing/normal_fish.png" alt="Fish">Normal Fish (qty/wl):</label>
                <input type="text" id="prc_fish_norm" value="400/1">
            </div>
            <div class="input-group ura-field">
                <label><img src="image/fishing/perfect_fish.png" alt="Perfect">Perfect Fish (qty/wl):</label>
                <input type="text" id="prc_fish_perf" value="1/4">
            </div>

            <div class="input-group role7-field hidden-group">
                <label><img src="image/tackle_box/shrimp_lure.png" alt="Shrimp">Shrimp Lure (qty/wl):</label>
                <input type="text" id="prc_shrimp" value="1/3">
            </div>
            <div class="input-group role7-field hidden-group">
                <label><img src="image/fishing/naval_mine.png" alt="Naval">Naval Mine (qty/wl):</label>
                <input type="text" id="prc_naval" value="1/30">
            </div>
        </div>

        <button onclick="calculateFishing()" style="margin-top: 20px;">Calculate</button>
        <button id="downloadBtn" onclick="downloadResult()">Download Result as Image</button>

        <div id="fsh_res" class="result-box" style="display: none;"></div>
    </div>

    <script>
        function toggleModeFields() {
            const mode = document.getElementById('fishing_mode').value;
            document.querySelectorAll('.ura-field').forEach(f => f.style.display = (mode === 'uranium' ? 'block' : 'none'));
            document.querySelectorAll('.role7-field').forEach(f => f.style.display = (mode === 'role7' ? 'block' : 'none'));
        }

        function parseRatio(str) {
            if (str.includes('/')) {
                const parts = str.split('/');
                return parseFloat(parts[1]) / parseFloat(parts[0]);
            }
            return parseFloat(str) || 0;
        }

        function calculateFishing() {
            const res = document.getElementById('fsh_res');
            const downloadBtn = document.getElementById('downloadBtn');
            const mode = document.getElementById('fishing_mode').value;

            res.style.display = 'block';
            downloadBtn.style.display = 'block';

            const bait_amt = Math.round(parseFloat(document.getElementById('bait_amt').value)) || 0;
            const trawler_choice = document.getElementById('use_trawl').value;

            let trawler_count = (trawler_choice === "Y") ? Math.ceil(bait_amt / 225) : 0;
            let sec_per_bait = (trawler_choice === "Y") ? 8 : 10;
            let total_seconds = bait_amt * sec_per_bait;

            const h = Math.floor(total_seconds / 3600);
            const m = Math.floor((total_seconds % 3600) / 60);
            const s = total_seconds % 60;

            const pBait = parseRatio(document.getElementById('prc_bait').value);
            const pTrawl = parseRatio(document.getElementById('prc_trawl').value);

            let total_expenses = 0;
            let total_income = 0;
            let income_html = "";
            let expense_html = "";

            if (mode === 'uranium') {
                const costBait = bait_amt * pBait;
                const costTrawl = trawler_count * pTrawl;
                const det_qty = Math.ceil(bait_amt * 0.05);
                const costDet = det_qty * parseRatio(document.getElementById('prc_detonator').value);

                total_expenses = costBait + costTrawl + costDet;

                expense_html = `
                    <div class="result-item" style="opacity: 0.8; font-size: 0.85em;"><span>• Baits (${bait_amt}):</span><span>-${costBait.toFixed(1)} WL</span></div>
                    <div class="result-item" style="opacity: 0.8; font-size: 0.85em;"><span>• Trawler (${trawler_count}):</span><span>-${costTrawl.toFixed(1)} WL</span></div>
                    <div class="result-item" style="opacity: 0.8; font-size: 0.85em;"><span>• Detonators (${det_qty}):</span><span>-${costDet.toFixed(1)} WL</span></div>
                `;

                const qtyPerf = Math.floor(bait_amt * 0.1);
                const qtyNorm = bait_amt - qtyPerf;
                const lbsNorm = qtyNorm * 50;
                const valNorm = lbsNorm * parseRatio(document.getElementById('prc_fish_norm').value);
                const valPerf = qtyPerf * parseRatio(document.getElementById('prc_fish_perf').value);

                const qtyWhiz = Math.floor(bait_amt * 0.003);
                const qtyBrain = Math.floor(bait_amt * 0.03);
                const qtyOoze = Math.floor(bait_amt * 0.03);

                const valWhiz = qtyWhiz * parseRatio(document.getElementById('prc_whizmo').value);
                const valBrain = qtyBrain * parseRatio(document.getElementById('prc_brain').value);
                const valOoze = qtyOoze * parseRatio(document.getElementById('prc_ooze').value);

                total_income = valNorm + valPerf + valWhiz + valBrain + valOoze;

                income_html = `
                    <div class="result-item"><span>Normal Fish (${qtyNorm} | ~${lbsNorm}lb):</span><span>${valNorm.toFixed(1)} WL</span></div>
                    <div class="result-item"><span>Perfect Fish (${qtyPerf}):</span><span>${valPerf.toFixed(1)} WL</span></div>
                    <div class="result-item" style="opacity: 0.8; font-size: 0.85em; border-top: 1px dashed #334155; margin-top: 5px; padding-top: 5px;">
                        <span>Whizmo (${qtyWhiz}):</span><span>${valWhiz.toFixed(1)} WL</span>
                    </div>
                    <div class="result-item" style="opacity: 0.8; font-size: 0.85em;">
                        <span>Brainworm (${qtyBrain}):</span><span>${valBrain.toFixed(1)} WL</span>
                    </div>
                    <div class="result-item" style="opacity: 0.8; font-size: 0.85em;">
                        <span>Primordial Ooze (${qtyOoze}):</span><span>${valOoze.toFixed(1)} WL</span>
                    </div>
                `;
            } else {
                const costBait = bait_amt * pBait;
                const costTrawl = trawler_count * pTrawl;
                total_expenses = costBait + costTrawl;

                expense_html = `
                    <div class="result-item" style="opacity: 0.8; font-size: 0.85em;"><span>• Baits (${bait_amt}):</span><span>-${costBait.toFixed(1)} WL</span></div>
                    <div class="result-item" style="opacity: 0.8; font-size: 0.85em;"><span>• Trawler (${trawler_count}):</span><span>-${costTrawl.toFixed(1)} WL</span></div>
                `;

                const qtyShrimp = Math.round(bait_amt * 0.075);
                const qtyNaval = Math.round(bait_amt * 0.015);
                const valShrimp = qtyShrimp * parseRatio(document.getElementById('prc_shrimp').value);
                const valNaval = qtyNaval * parseRatio(document.getElementById('prc_naval').value);

                total_income = valShrimp + valNaval;
                income_html = `
                    <div class="result-item"><span>Shrimp Lure (${qtyShrimp}):</span><span>${valShrimp.toFixed(1)} WL</span></div>
                    <div class="result-item"><span>Naval Mine (${qtyNaval}):</span><span>${valNaval.toFixed(1)} WL</span></div>
                `;
            }

            const profit = total_income - total_expenses;

            res.innerHTML = `
                <h3 style="text-align:center; border-bottom: 1px solid #334155; padding-bottom: 10px; margin: 0;">${mode.toUpperCase()} REPORT</h3>
                <div class="result-item" style="color: #38bdf8; font-weight: bold; margin: 10px 0;">
                    <span>Total Time:</span><span>${h}h ${m}m ${s}s</span>
                </div>
                <div class="result-item" style="font-weight: bold; color: #f87171; border-top: 1px solid #334155; padding-top: 8px;">
                    <span>TOTAL EXPENSES:</span><span>${total_expenses.toFixed(1)} WL</span>
                </div>
                ${expense_html}
                <div class="result-item" style="font-weight: bold; color: #4ade80; border-top: 1px solid #334155; margin-top: 10px; padding-top: 8px;">
                    <span>TOTAL INCOME:</span><span>${total_income.toFixed(1)} WL</span>
                </div>
                ${income_html}
                <hr style="border:0; border-top:1px solid #334155; margin:15px 0;">
                <div class="result-item" style="color: ${profit >= 0 ? '#4ade80' : '#f87171'}; font-weight: bold; font-size: 1.2em;">
                    <span>NET PROFIT:</span><span>${profit.toFixed(1)} WL</span>
                </div>
            `;
        }

        function downloadResult() {
            const resultBox = document.getElementById('fsh_res');
            const exportBg = "#0f172a";

            html2canvas(resultBox, {
                backgroundColor: exportBg,
                scale: 3,
                logging: false,
                useCORS: true,
                onclone: (clonedDoc) => {
                    const clonedRes = clonedDoc.getElementById('fsh_res');
                    clonedRes.style.display = 'block';
                    clonedRes.style.background = exportBg;
                    clonedRes.style.padding = '25px';
                    clonedRes.style.animation = 'none';

                    const items = clonedRes.querySelectorAll('.result-item');
                    items.forEach(item => {
                        item.style.opacity = '1';
                        item.style.display = 'flex';
                        item.style.justifyContent = 'space-between';
                        item.style.visibility = 'visible';
                        const currentColor = window.getComputedStyle(item).color;
                        item.style.color = currentColor;
                    });
                }
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = 'fishing_report.png';
                link.href = canvas.toDataURL("image/png", 1.0);
                link.click();
            });
        }

        function toggleMenu() {
            const nav = document.getElementById('sideNav');
            const overlay = document.getElementById('overlay');
            nav.classList.toggle('active');
            overlay.classList.toggle('active');
            const btn = document.querySelector('.menu-toggle');
            btn.innerHTML = nav.classList.contains('active') ? '✕' : '☰';
        }

        // Active Link Logic
        const navLinks = document.querySelectorAll('.nav-link');
        let currentPage = window.location.pathname.split('/').pop() || 'index.html';

        navLinks.forEach(link => {
            if (link.getAttribute('href') === currentPage) {
                link.classList.add('active');
            } else {
                link.classList.remove('active');
            }
        });
    </script>
</body>

</html>
